services:
  server:
    image: ${SERVER_IMAGE:-downtune-server:ci}
    build:
      context: ./server
    environment:
      NODE_ENV: production
      PORT: "3001"
      DOWNLOAD_PATH: /usr/src/downloads
      SEARCH_PROVIDER: deezer
      ALLOWED_ORIGIN: http://client
    volumes:
      - downloads:/usr/src/downloads
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001/', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  client:
    image: ${CLIENT_IMAGE:-downtune-client:ci}
    build:
      context: ./client
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  smoke:
    image: curlimages/curl:8.15.0
    profiles: ["test"]
    depends_on:
      client:
        condition: service_healthy
    command:
      - /bin/sh
      - -ec
      - |
        curl --fail --silent --show-error http://client/ >/dev/null
        curl --fail --silent --show-error http://client/api/csrf-token | grep -q '"token"'

volumes:
  downloads:
