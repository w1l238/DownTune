services:
  server:
    image: ${SERVER_IMAGE:?Set SERVER_IMAGE to an immutable registry reference}
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      PORT: "3001"
      DOWNLOAD_PATH: /usr/src/downloads
    volumes:
      - ${DOWNLOADS_PATH:?Set DOWNLOADS_PATH}:/usr/src/downloads
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001/', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  client:
    image: ${CLIENT_IMAGE:?Set CLIENT_IMAGE to an immutable registry reference}
    restart: unless-stopped
    ports:
      - ${APP_PORT:-3000}:80
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
