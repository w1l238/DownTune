networks:
  cloudflare-net:
    external: true

services:
  server:
    container_name: Spotify-Downloader-BACKEND
    build: ./server
    restart: unless-stopped
    networks:
      cloudflare-net:
        ipv4_address: 172.24.0.7
    # Port 3001 is NOT exposed to the host — only reachable by the nginx container
    # on the shared Docker network. Caddy proxies through nginx, not directly here.
    env_file:
      - ./server/.env
    volumes:
      - /home/w1l/plexamp-music:/usr/src/downloads
    dns:
      - 8.8.8.8
      - 8.8.4.4
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  client:
    container_name: Spotify-Downloader-FRONTEND
    build: ./client
    restart: unless-stopped
    networks:
      cloudflare-net:
        ipv4_address: 172.24.0.8
    ports:
      - "3000:80"
    depends_on:
      server:
        condition: service_healthy
