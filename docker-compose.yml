services:
  server:
    container_name: DownTune-Backend
    build: ./server
    restart: unless-stopped
    env_file:
      - ./server/.env
    volumes:
      - /your/path/here:/usr/src/downloads
    dns:
      - 8.8.8.8
      - 8.8.4.4
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  client:
    container_name: DownTune-Frontend
    build: ./client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      server:
        condition: service_healthy
