server {
  listen 80;

  # ── Gzip compression ──────────────────────────────────────────────────
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/javascript application/javascript
             application/json image/svg+xml;

  # ── Security headers ──────────────────────────────────────────────────
  add_header X-Content-Type-Options  "nosniff"       always;
  add_header X-Frame-Options         "SAMEORIGIN"    always;
  add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

  # ── Downloads — long timeout (yt-dlp can take several minutes) ────────
  location = /download-song {
    proxy_pass         http://server:3001;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 660s;   # 11 min — covers the 10-min client abort + buffer
    proxy_send_timeout 660s;
    proxy_buffering    off;    # stream the response instead of buffering
  }

  # ── Backend API (library, files, proxy, etc.) ─────────────────────────
  location /api {
    proxy_pass         http://server:3001;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
  }

  # ── Other backend endpoints ───────────────────────────────────────────
  location ~ ^/(search-spotify|spotify-proxy|config|create-folder-structure) {
    proxy_pass         http://server:3001;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
  }

  # ── Static frontend ───────────────────────────────────────────────────
  location / {
    root       /usr/share/nginx/html;
    index      index.html index.htm;
    try_files  $uri $uri/ /index.html;

    # Cache static assets aggressively; HTML never cached (SPA shell)
    location ~* \.(js|css|woff2?|ttf|otf|svg|png|jpg|jpeg|ico|webp)$ {
      expires    1y;
      add_header Cache-Control "public, immutable";
    }
  }

  error_page 500 502 503 504 /50x.html;
  location = /50x.html {
    root /usr/share/nginx/html;
  }
}
